# 集智 AI OPC 官网 · nginx 站点配置（Rocky Linux 9）
#
# 放置位置：/etc/nginx/conf.d/jizhi.conf
# 改完：nginx -t && systemctl reload nginx
#
# ── 为什么 nginx 只做反代，不做静态站 ────────────────────────────────────
# 本站是 Next.js 15 App Router，**不能**用 `output: 'export'` 导出成纯静态：
#   - /api/leads        POST 留资（表单提交）
#   - /api/admin/*      后台线索 / 新闻 CRUD（force-dynamic）
#   - /api/og           动态分享图（nodejs runtime，运行时生成 PNG）
#   - /api/search       站内检索（force-dynamic）
#   - /admin/*          后台页（force-dynamic + 服务端会话校验）
#   - 多个页面 revalidate = 300/600/3600 → 依赖 **服务端** ISR 再生成
# 静态导出后这些路由会 404 或退化成死页面。
# 所以：nginx = TLS 终止 + 反向代理 + 静态资源长缓存，**Node 进程才是真正的应用**。
#
# ── 三条硬约束（改配置前先读）────────────────────────────────────────────
# 1. 不要对 HTML 加 proxy_cache
#    ISR 页面的响应头是 `Cache-Control: s-maxage=300, stale-while-revalidate`。
#    nginx 一旦缓存，Next 的 ISR 再生成就再也触发不了 → 内容改了线上不变，
#    而且这个故障**不会报错**，只会表现成「改了半天没生效」。
#    只有 /_next/static/ 这类 immutable 资源才适合长缓存。
#
# 2. 必须透传 X-Forwarded-Proto 和 Host
#    Next 用这两个头生成 canonical 链接、sitemap.xml 绝对地址、重定向和
#    分享卡片的 og:url。少了 → 站点对外暴露 127.0.0.1:3000 或 http:// 明文地址。
#
# 3. 只反代一个上游端口，不要做多端口负载均衡
#    ISR 缓存写在**本地磁盘** .next/cache 里。多实例各写各的缓存 →
#    同一份内容被重复生成，且各实例缓存不一致。
#    要横向扩容必须先把 ISR 缓存换成共享存储（Redis / Vercel 那套托管方案）。

# WebSocket / HTTP 升级映射（Next 的 server actions 与 dev HMR 需要，普通页面无感）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 限流区：后台登录与留资接口共用（具体阈值在 location 里覆盖）
limit_req_zone $binary_remote_addr zone=jizhi_api:10m rate=10r/s;

# Node 应用上游。**单实例**，原因见上方约束 3。
upstream jizhi_app {
    server 127.0.0.1:3000;
    keepalive 32;
    # 不用 backup：没有第二实例，备份上游只会把错误变成更难排查的超时
}

# ── HTTP → HTTPS 跳转 ────────────────────────────────────────────────────
server {
    listen      80;
    listen      [::]:80;
    server_name t.3cool.cc;

    # ACME 证书续签走 HTTP-01，必须放行 /.well-known/
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── 主站 HTTPS ───────────────────────────────────────────────────────────
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name t.3cool.cc;

    # ── 证书 ──────────────────────────────────────────────────────────────
    # Let's Encrypt（certbot）路径。若用自签或云厂商证书，换成对应路径即可。
    ssl_certificate     /etc/letsencrypt/live/t.3cool.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/t.3cool.cc/privkey.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_stapling              on;
    ssl_stapling_verify       on;

    # ── 基本参数 ──────────────────────────────────────────────────────────
    # 留资表单 / 后台上传：默认 1m 会直接 413
    client_max_body_size 8m;
    client_body_timeout  30s;
    server_tokens        off;

    # ── gzip ──────────────────────────────────────────────────────────────
    # Next 自己已经 compress: true（对文本类资源）。这里作为兜底；
    # nginx 看到上游已带 Content-Encoding: gzip 时不会重复压缩。
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/xml application/json application/javascript
                      application/xml application/xml+rss image/svg+xml font/woff font/woff2;

    # ── 安全响应头 ────────────────────────────────────────────────────────
    # next.config.ts 已设 X-Content-Type-Options / Referrer-Policy / X-Frame-Options，
    # 这里补 nginx 侧独有的两项。
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # 本站 3D 场景用到 blob:/data:（WebGL 纹理与字体），CSP 需按实测调整，
    # 不要盲目套用通配模板。
    # add_header Content-Security-Policy "..." always;

    # ── Next 客户端静态资源（immutable，可长缓存）────────────────────────
    location /_next/static/ {
        proxy_pass http://jizhi_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # ── 公开静态文件（favicon / logo / 图片）─────────────────────────────
    location /_next/image {
        proxy_pass http://jizhi_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800" always;
    }

    # ── 后台接口：限流更严 ────────────────────────────────────────────────
    location /api/admin/ {
        limit_req zone=jizhi_api burst=20 nodelay;
        proxy_pass http://jizhi_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── 其余全部交给 Next ────────────────────────────────────────────────
    location / {
        proxy_pass http://jizhi_app;

        # 1.1 + Upgrade：Next 的 server actions / RSC 请求需要
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # 透传真实访问信息（约束 2）
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # 超时：/api/og 动态渲染 PNG + /api/admin 报表导出，给足时间
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # 不缓冲，直接透传，减少首字节延迟
        proxy_buffering on;
        proxy_buffers   16 16k;
        proxy_busy_buffers_size 32k;

        # ── 刻意不加 proxy_cache ─────────────────────────────────────────
        # 原因见文件头约束 1：缓存 HTML 会让 ISR 再生成永远不生效。
    }
}
