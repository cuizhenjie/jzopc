# 仅安装在外层跳板机；Rocky 192.168.10.179 只运行 Node。
# /etc/nginx/conf.d/jizhi.conf 应被包含在 nginx 的 http 块内。
# 本站使用跳板机已有证书；部署前检查证书域名、期限及私钥匹配。
# 默认假定此 Nginx 直接面向访客；若前面有 CDN，先配置限定来源的 real_ip。
upstream jizhi_app {
    server 192.168.10.179:4000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.jizhiai.net.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://www.jizhiai.net.cn$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.jizhiai.net.cn;

    # 跳板机已有正式证书；由既有证书管理流程负责续期。
    ssl_certificate /usr/local/nginx/conf/ssl/www.jizhiai.net.cn.pem;
    ssl_certificate_key /usr/local/nginx/conf/ssl/www.jizhiai.net.cn.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:JizhiTLS:10m;
    ssl_session_timeout 1d;
    server_tokens off;
    client_max_body_size 8m;
    client_body_timeout 30s;

    # 全部路由（含 /api、/admin、/_next/static、图片）继承同一组代理头。
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host www.jizhiai.net.cn;
    proxy_set_header X-Real-IP $remote_addr;
    # 覆盖客户端输入，避免应用按伪造 XFF 的第一项执行限流。
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host www.jizhiai.net.cn;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header Forwarded "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_buffering off;
    proxy_cache off;

    # 保留 Next 自身的 Cache-Control：静态资源长缓存，动态页面/API 自行控制。
    location / {
        proxy_pass http://jizhi_app;
    }
}
